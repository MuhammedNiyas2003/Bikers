version: '3.8'

services:
  motoescape-app:
    build: .
    container_name: motoescape-app
    ports:
      - "5000:5000"
    volumes:
      - motoescape-db:/data
    environment:
      - PORT=5000
      - DATABASE_PATH=/data/motoescape.db
      - NODE_ENV=production
    restart: always

volumes:
  motoescape-db:
